eight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">職業の画像 1200×630</text><text x="44" y="333" font-size="17" fill="#2B2F5B" text-anchor="start" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">衛星データ解析</text><text x="44" y="357" font-size="17" fill="#2B2F5B" text-anchor="start" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">エンジニア</text><text x="44" y="383" font-size="10" fill="#8A8FB0" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">人工衛星から得られるデータを</text><text x="44" y="399" font-size="10" fill="#8A8FB0" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">分析して、暮らしや社会に役立てる仕事です。</text><rect x="44" y="417" width="76" height="22" rx="11" fill="#EFEBFF" stroke="#EFEBFF" stroke-width="1"/><text x="82" y="432" font-size="9" fill="#6C5CE1" text-anchor="middle" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif"># 宇宙・星</text><rect x="128" y="417" width="76" height="22" rx="11" fill="#EFEBFF" stroke="#EFEBFF" stroke-width="1"/><text x="166" y="432" font-size="9" fill="#6C5CE1" text-anchor="middle" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif"># PC・IT</text><rect x="212" y="417" width="76" height="22" rx="11" fill="#EFEBFF" stroke="#EFEBFF" stroke-width="1"/><text x="250" y="432" font-size="9" fill="#6C5CE1" text-anchor="middle" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif"># 調べる・研究</text><rect x="44" y="453" width="272" height="38" rx="19.0" fill="#FFFFFF" stroke="#D9D6F2" stroke-width="1"/><text x="180.0" y="477.0" font-size="14" fill="#6C5CE1" text-anchor="middle" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">次の仕事を見る ↓</text><rect x="44" y="499" width="272" height="40" rx="20.0" fill="#6C5CE1" stroke="#6C5CE1" stroke-width="1"/><text x="180.0" y="524.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">詳しく見る →</text><text x="180" y="626" font-size="10" fill="#6C5CE1" text-anchor="middle" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">⌃ 上にスワイプして次の仕事を見る</text><rect x="90" y="357" width="180" height="26" rx="13" fill="#2B2F5B" opacity="0.0"/><text x="180" y="690" font-size="10" fill="#8A8FB0" text-anchor="middle" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">きっと、まだ知らない仕事がある。</text></g><text x="430" y="110" font-size="13" fill="#E07B00" text-anchor="start" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">■ 画面の要点</text><circle cx="438" cy="140" r="9" fill="#E07B00"/><text x="438" y="144" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">1</text><text x="456" y="144" font-size="11" fill="#2B2F5B" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">1画面＝1職業。情報は少なめ</text><circle cx="438" cy="186" r="9" fill="#E07B00"/><text x="438" y="190" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">2</text><text x="456" y="190" font-size="11" fill="#2B2F5B" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">上スワイプで次の職業（ボタンでも進める）</text><circle cx="438" cy="232" r="9" fill="#E07B00"/><text x="438" y="236" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">3</text><text x="456" y="236" font-size="11" fill="#2B2F5B" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">上スワイプが使えなくても「次の仕事を見る</text><text x="456" y="251" font-size="11" fill="#2B2F5B" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">」ボタンで進める（※「知らなかった！」は</text><text x="456" y="266" font-size="11" fill="#2B2F5B" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">今回実装しない）</text><circle cx="438" cy="278" r="9" fill="#E07B00"/><text x="438" y="282" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">4</text><text x="456" y="282" font-size="11" fill="#2B2F5B" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">「詳しく見る」でUI-S07へ。取得失敗</text><text x="456" y="297" font-size="11" fill="#2B2F5B" text-anchor="start" font-weight="normal" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">時は再試行</text></svg>